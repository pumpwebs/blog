<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blog</title>
<style>
:root{--blue:#0b4ea2;--navy:#0a2540;--grey:#f3f3f3}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,Arial,sans-serif;color:#555;line-height:1.7}a{color:inherit;text-decoration:none}.wrap{max-width:1170px;margin:0 auto;padding:0 15px}
.top{background:#000;color:#fff;height:56px;position:relative;overflow:hidden}.top .wrap{height:100%;display:flex;align-items:center}
.hot{position:absolute;right:0;top:18px;height:56px;width:58%;background:var(--blue);clip-path:polygon(6% 0,100% 0,100% 100%,0 100%);display:flex;align-items:center;padding-left:9%;color:#fff;z-index:2}
.hdr{padding:22px 0}.hdr .wrap{display:flex;gap:36px;align-items:center;flex-wrap:wrap}.logo{font:900 56px/1 Impact,"Arial Narrow",sans-serif;color:var(--blue);letter-spacing:-2px}
.info{font-size:14px}.info b{display:block;color:#000}
nav{background:#000}nav .wrap{display:flex;height:60px;align-items:stretch;flex-wrap:wrap}nav a,nav button{display:flex;align-items:center;padding:0 20px;color:#fff;font-weight:700;background:none;border:0;font-size:15px;cursor:pointer}
nav a.on{color:#4da3ff;border-bottom:3px solid #4da3ff}nav .sp{flex:1}nav .cta{background:var(--blue);clip-path:polygon(12% 0,100% 0,100% 100%,0 100%);padding:0 28px}
.hero{background:linear-gradient(120deg,#e8f0fb,#b9d8f0);padding:90px 0}.hero h1{font:900 44px/1.2 Arial;color:var(--blue);max-width:760px}.hero p{font-size:20px;margin-top:14px;max-width:700px}
.sec{padding:60px 0}h2{text-align:center;font-size:34px;color:#000}h2 em{font-style:normal;color:var(--blue)}.bar{width:60px;height:3px;background:#ccc;margin:16px auto 36px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}.tabs button{border:1px solid var(--blue);background:#fff;color:var(--blue);padding:8px 24px;cursor:pointer;transform:skewX(-20deg)}.tabs button span{display:inline-block;transform:skewX(20deg)}.tabs .on{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.card{border:1px solid #ddd;cursor:pointer;background:#fff}.card .im{aspect-ratio:360/250;background:linear-gradient(135deg,#1d6fe0,#0b4ea2);overflow:hidden}.card img{width:100%;height:100%;object-fit:cover}
.card .b{padding:20px}.card small{color:var(--blue)}.card h3{font-size:19px;color:#222;font-weight:500;margin:4px 0 8px}.card p{font-size:14px}.card .m{border-top:1px solid #ddd;text-align:center;padding:13px;font-size:14px}.card:hover .m{background:var(--blue);color:#fff}
.band{background:var(--navy);color:#fff;padding:46px 0}.band .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.band p{font-size:24px}.band b{color:#4da3ff;font-weight:400}
.btn{display:inline-block;border:2px solid #fff;color:#fff;padding:12px 38px}.art{max-width:820px;margin:0 auto}.art h1{font-size:36px;color:#000;line-height:1.3}.art .cv{width:100%;margin:22px 0}.art .c{font-size:17px}.art .c img{max-width:100%;height:auto}.art .c h2,.art .c h3{text-align:left;font-size:24px;margin:24px 0 8px}.art .c p,.art .c ul{margin-bottom:14px}.art .c ul{margin-left:24px}.art .c a{color:var(--blue);text-decoration:underline}
.ban{background:linear-gradient(90deg,#b9d8f0,#8fc1e6);height:170px;display:flex;align-items:flex-end;color:#fff;font:900 42px Arial;text-transform:uppercase}.ban .wrap{padding-bottom:18px}
footer{background:var(--navy);color:#cfd8e3;padding:50px 0 0}footer .cols{display:grid;grid-template-columns:1.5fr 1fr 1fr;gap:40px}footer h4{color:#fff;font-size:20px;font-weight:400;margin-bottom:16px}footer .logo{font-size:50px}.cp{border-top:1px solid #345;margin-top:36px;padding:20px 0;font-size:14px}
@media(max-width:800px){.hot{display:none}.grid,footer .cols{grid-template-columns:1fr}.hero h1{font-size:30px}nav .cta{display:none}}
</style></head><body>
<div class="top"><div class="wrap" id="wel"></div><div class="hot" id="hot"></div></div>
<div class="hdr"><div class="wrap"><a class="logo" href="#home" id="logo"></a><div class="info"><b id="a1"></b><span id="a2"></span></div><div class="info"><b id="m1"></b><span id="m2"></span></div><div class="info"><b id="h1"></b><span id="h2"></span></div></div></div>
<nav><div class="wrap" id="nav"></div></nav><main id="app"></main>
<footer><div class="wrap"><div class="cols" id="ft"></div><div class="cp" id="cp"></div></div></footer>
<script>
const T={vi:{home:"Trang chủ",blog:"Bài viết",about:"Giới thiệu",contact:"Liên hệ",adv:"Liên hệ ngay",lang:"🌐 English",all:"Tất cả",latest:["Bài viết ","mới nhất"],more:"Đọc tiếp »",none:"Chưa có bài viết.",back:"‹ Quay lại",wel:"Chào mừng bạn đến với website của chúng tôi",hot:"Cần hỗ trợ? ",addr:"Địa chỉ",mail:"Gửi email cho chúng tôi",hrs:"Giờ làm việc",band:["Bạn cần tư vấn? ","Hãy liên hệ với chúng tôi."],send:"GỬI EMAIL",links:"Liên kết"},
en:{home:"Home",blog:"Blog",about:"About Us",contact:"Contact Us",adv:"Contact now",lang:"🌐 Tiếng Việt",all:"All",latest:["Latest ","Posts"],more:"Read More »",none:"No posts yet.",back:"‹ Back",wel:"Welcome to our website",hot:"Have any question? ",addr:"Address",mail:"Send Your Mail At",hrs:"Working Hours",band:["Need advice? ","Get in touch with us."],send:"SEND EMAIL",links:"Quick Links"}};
let lang=localStorage.lang||"vi",S={},P=[];const $=i=>document.getElementById(i),t=()=>T[lang];
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pk=(o,k)=>(lang=="en"&&o[k+"_en"])||o[k]||"";
const fd=d=>{const x=new Date(d);return isNaN(x)?d:x.toLocaleDateString(lang=="vi"?"vi-VN":"en-GB")};
const card=p=>`<div class="card" onclick="location.hash='post/${p.slug}'"><div class="im">${p.cover?`<img src="${p.cover}" alt="">`:""}</div><div class="b"><small>${esc(p.cat)} · ${fd(p.created)}</small><h3>${esc(pk(p,"title"))}</h3><p>${esc(pk(p,"excerpt"))}</p></div><div class="m">${t().more}</div></div>`;
const ban=(a,b)=>`<div class="ban"><div class="wrap">${a}</div></div><div style="background:var(--grey);padding:18px 0;text-transform:uppercase;font-size:14px"><div class="wrap">${t().home} › ${b}</div></div>`;
const R={
home(){const x=t();return `<section class="hero"><div class="wrap"><h1>${esc(pk(S,"hero")||"Chào mừng đến với blog")}</h1><p>${esc(pk(S,"sub"))}</p></div></section>
<section class="sec"><div class="wrap"><h2><em>${x.latest[0]}</em>${x.latest[1]}</h2><div class="bar"></div><div class="grid">${P.slice(0,6).map(card).join("")||x.none}</div></div></section>
<section class="band"><div class="wrap"><p>${x.band[0]}<b>${x.band[1]}</b></p><a class="btn" href="#contact">${x.adv}</a></div></section>`},
blog(c){const x=t(),cs=[...new Set(P.map(p=>p.cat).filter(Boolean))];c=decodeURIComponent(c||"");
 return ban(x.blog,x.blog)+`<section class="sec"><div class="wrap"><div class="tabs"><button class="${c?'':'on'}" onclick="location.hash='blog'"><span>${x.all}</span></button>${cs.map(k=>`<button class="${k==c?'on':''}" onclick="location.hash='blog/'+encodeURIComponent('${esc(k)}')"><span>${esc(k)}</span></button>`).join("")}</div><div class="grid">${P.filter(p=>!c||p.cat==c).map(card).join("")||x.none}</div></div></section>`},
async post(slug){const r=await fetch("/api/posts/"+slug);if(!r.ok)return `<section class="sec"><div class="wrap">${t().none}</div></section>`;const p=await r.json();document.title=pk(p,"title");
 return `<section class="sec"><div class="wrap art"><a href="#blog" style="color:var(--blue)">${t().back}</a><h1>${esc(pk(p,"title"))}</h1><small>${esc(p.cat)} · ${fd(p.created)}</small>${p.cover?`<img class="cv" src="${p.cover}" alt="">`:""}<div class="c">${pk(p,"body")}</div></div></section>`},
about(){return ban(t().about,t().about)+`<section class="sec"><div class="wrap art c">${pk(S,"about").split("\n").map(l=>`<p>${esc(l)}</p>`).join("")}</div></section>`},
contact(){const x=t();return ban(x.contact,x.contact)+`<section class="sec"><div class="wrap art c"><p><b>${x.addr}:</b> ${esc(S.address)}</p><p><b>Tel:</b> ${esc(S.phone)}</p><p><b>Email:</b> ${esc(S.email)}</p><p><b>${x.hrs}:</b> ${esc(S.hours)}</p><p><a class="btn" style="background:var(--blue);text-decoration:none;color:#fff" href="mailto:${esc(S.email)}">${x.send}</a></p></div></section>`}};
function chrome(){const x=t(),p=(location.hash.slice(1)||"home").split("/")[0];document.documentElement.lang=lang;
 $("wel").textContent=x.wel;$("hot").textContent=x.hot+(S.phone||"");$("logo").textContent=S.brand||"BLOG";document.title=S.brand||"Blog";
 $("a1").textContent=x.addr;$("a2").textContent=S.address||"";$("m1").textContent=x.mail;$("m2").textContent=S.email||"";$("h1").textContent=x.hrs;$("h2").textContent=S.hours||"";
 $("nav").innerHTML=["home","blog","about","contact"].map(k=>`<a href="#${k}" class="${p==k?'on':''}">${x[k]}</a>`).join("")+`<span class="sp"></span><button onclick="lang=lang=='vi'?'en':'vi';localStorage.lang=lang;go()">${x.lang}</button><a class="cta" href="#contact">${x.adv} →</a>`;
 $("ft").innerHTML=`<div><div class="logo">${esc(S.brand)}</div><p>${esc(pk(S,"sub"))}</p></div><div><h4>${x.links}</h4>${["home","blog","about","contact"].map(k=>`<p><a href="#${k}">${x[k]}</a></p>`).join("")}</div><div><h4>${x.contact}</h4><p>${esc(S.address)}</p><p>${esc(S.phone)}</p><p>${esc(S.email)}</p></div>`;
 $("cp").textContent="© "+new Date().getFullYear()+" "+(S.brand||"");}
async function go(){const [p,a]=(location.hash.slice(1)||"home").split("/");chrome();$("app").innerHTML=await (R[p]||R.home)(a);}
addEventListener("hashchange",()=>{go();scrollTo(0,0)});
Promise.all([fetch("/api/settings").then(r=>r.json()),fetch("/api/posts").then(r=>r.json())]).then(([s,p])=>{S=s;P=Array.isArray(p)?p:[];go()}).catch(()=>{$("app").innerHTML="<p style='padding:60px 15px'>Chưa kết nối cơ sở dữ liệu (xem hướng dẫn bước 4).</p>"});
</script></body></html>
