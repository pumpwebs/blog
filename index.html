<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Website</title><link rel="icon" id="fav" href="data:,">
<style>
:root{--blue:#0b4ea2;--navy:#0a2540;--grey:#f3f3f3}*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Roboto,Arial,sans-serif;color:#555;line-height:1.7}a{color:inherit;text-decoration:none}.wrap{max-width:1170px;margin:0 auto;padding:0 15px}
.top{background:#000;color:#fff;height:56px;position:relative;overflow:hidden}.top .wrap{height:100%;display:flex;align-items:center}
.hot{position:absolute;right:0;top:18px;height:56px;width:58%;background:var(--blue);clip-path:polygon(6% 0,100% 0,100% 100%,0 100%);display:flex;align-items:center;padding-left:9%;color:#fff}
.hdr{padding:20px 0}.hdr .wrap{display:flex;gap:34px;align-items:center;flex-wrap:wrap}.logo{font:900 54px/1 Impact,"Arial Narrow",sans-serif;color:var(--blue);letter-spacing:-2px}.logo img{height:64px}
.info{font-size:14px}.info b{display:block;color:#000}
nav{background:#000;position:relative;z-index:10}nav .wrap{display:flex;height:60px;align-items:stretch}nav ul{list-style:none;display:flex;flex:1}nav li{position:relative}
nav li>a,nav>.wrap>button{display:flex;align-items:center;height:60px;padding:0 18px;color:#fff;font-weight:700;font-size:15px;background:none;border:0;cursor:pointer;white-space:nowrap}
nav li>a.on,nav li:hover>a{color:#4da3ff}nav li>a.on{border-bottom:3px solid #4da3ff}
.dd{display:none;position:absolute;top:60px;left:0;background:#fff;min-width:210px;box-shadow:0 4px 12px #0003}nav li:hover .dd{display:block}.dd a{display:block;padding:10px 14px;color:#222;font-size:13px;font-weight:700}.dd a:hover{background:var(--grey);color:var(--blue)}
.cta{background:var(--blue);color:#fff;display:flex;align-items:center;padding:0 28px;font-weight:700;clip-path:polygon(12% 0,100% 0,100% 100%,0 100%)}.burger{display:none}
.hero{min-height:560px;background:#dfe7f1 center/cover;display:flex;align-items:center}.hero .in{background:linear-gradient(90deg,#fffd 60%,#fff0);padding:60px 0;width:100%}.hero h1{font:900 46px/1.2 Arial;color:var(--blue)}.hero li{list-style:none;font:800 38px/1.5 Arial;color:var(--blue)}.hero li:before{content:"· "}
.sec{padding:60px 0}h2{text-align:center;font-size:34px;color:#000}h2 em{font-style:normal;color:var(--blue)}.bar{width:60px;height:3px;background:#ccc;margin:16px auto 34px}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:34px}.tabs button{border:1px solid var(--blue);background:#fff;color:var(--blue);padding:8px 24px;cursor:pointer;transform:skewX(-20deg)}.tabs button span{display:inline-block;transform:skewX(20deg)}.tabs .on{background:var(--blue);color:#fff}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:30px}.card{cursor:pointer;text-align:center}.card .im{aspect-ratio:4/3;background:#f6f8fb;display:flex;align-items:center;justify-content:center;color:var(--blue);font-weight:700;overflow:hidden;padding:8px}.card img{width:100%;height:100%;object-fit:contain}
.card h3{font-size:16px;color:#000;margin-top:10px}.card p{font-size:13px}.card:hover h3{color:var(--blue)}
.nw{border:1px solid #ddd;text-align:left;background:#fff}.nw .im{aspect-ratio:360/250;background:linear-gradient(135deg,#1d6fe0,#0b4ea2);overflow:hidden;position:relative}.nw img{width:100%;height:100%;object-fit:cover}.nw .b{padding:18px}.nw h3{font-size:18px;font-weight:400;color:#222}.nw small{color:var(--blue)}.nw .m{border-top:1px solid #ddd;padding:12px;text-align:center;font-size:14px}.nw:hover .m{background:var(--blue);color:#fff}
.band{background:var(--navy);color:#fff;padding:46px 0}.band .wrap{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap}.band p{font-size:24px}.band b{color:#4da3ff;font-weight:400}.btn{display:inline-block;border:2px solid var(--blue);color:var(--blue);padding:11px 36px;background:#fff;cursor:pointer}.band .btn{background:none;border-color:#fff;color:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center}.two h2{text-align:left}.two .bar{margin-left:0}.ph{background:linear-gradient(135deg,#1d6fe0,#0b4ea2);color:#fff;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center}
.logos{display:grid;grid-template-columns:repeat(5,1fr);gap:24px;background:var(--grey);padding:36px 15px}.logos div{background:#fff;height:100px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#789;padding:8px}.logos img{max-width:100%;max-height:100%}
.ban{background:linear-gradient(90deg,#b9d8f0,#8fc1e6);height:170px;display:flex;align-items:flex-end;color:#fff;font:900 42px Arial;text-transform:uppercase}.ban .wrap{padding-bottom:18px}.crumb{background:var(--grey);padding:18px 0;text-transform:uppercase;font-size:14px}
.side{display:grid;grid-template-columns:250px 1fr;gap:34px}.side h4{background:#000;color:#fff;padding:12px 15px;font-weight:400;font-size:18px}.side li{list-style:none;border-bottom:1px dotted #444;padding:9px 10px;cursor:pointer}.side li.on,.side li:hover{color:var(--blue);font-weight:700}
.row{display:flex;gap:22px;border:1px solid #ddd;padding:20px;margin-bottom:20px;cursor:pointer;align-items:center}.row .im{width:200px;aspect-ratio:4/3;background:#cfd8e6;flex:none;overflow:hidden}.row img{width:100%;height:100%;object-fit:cover}.row h3{color:#000}
.art{max-width:860px;margin:0 auto}.art h1{font-size:34px;color:#000;line-height:1.3}.c{font-size:17px}.c img{max-width:100%;height:auto}.c h2,.c h3{text-align:left;font-size:24px;margin:22px 0 8px}.c p,.c ul{margin-bottom:14px}.c ul{margin-left:24px}.c a{color:var(--blue);text-decoration:underline}.c table{border-collapse:collapse}.c td{border:1px solid #ccc;padding:6px}
.sub{display:flex;flex-wrap:wrap;border:1px solid #ddd;margin-bottom:30px}.sub a{flex:1;min-width:150px;padding:18px;text-align:center;background:#fafafa;border-right:1px solid #ddd}.sub a.on{background:var(--blue);color:#fff}
form{display:grid;gap:12px}input,textarea{width:100%;padding:11px;border:1px solid #ccc;font:inherit}form button{background:#000;color:#fff;border:0;padding:14px;cursor:pointer;font-size:16px}
footer{background:var(--navy);color:#cfd8e3;padding:60px 0 0;font-size:14px}footer .cols{display:grid;grid-template-columns:1.3fr 1fr 1fr 1.2fr;gap:36px}footer h4{color:#fff;font-size:20px;font-weight:400;margin-bottom:22px;padding-bottom:14px;border-bottom:1px solid #345;position:relative}footer h4:after{content:"";position:absolute;left:0;bottom:-1px;width:55px;height:2px;background:#4da3ff}footer .logo{font-size:50px}footer li{list-style:none;margin-bottom:8px;opacity:.75}footer li:hover{opacity:1}footer input,footer textarea{border:0}.cp{border-top:1px solid #345;margin-top:40px;padding:20px 0}
@media(max-width:900px){.hot{display:none}.grid,.two,.side,footer .cols{grid-template-columns:1fr}.logos{grid-template-columns:repeat(2,1fr)}.hero h1{font-size:30px}.hero li{font-size:24px}.burger{display:flex!important}nav .wrap{flex-wrap:wrap;height:auto}nav ul{display:none;flex-direction:column;width:100%;order:3}nav ul.open{display:flex}.dd{position:static;box-shadow:none}.cta{display:none}.row{flex-direction:column}.row .im{width:100%}}
</style></head><body>
<div class="top"><div class="wrap" id="wel"></div><div class="hot" id="hot"></div></div>
<div class="hdr"><div class="wrap"><a class="logo" href="#home" id="logo"></a><div class="info"><b id="a1"></b><span id="a2"></span></div><div class="info"><b id="m1"></b><span id="m2"></span></div><div class="info"><b id="h1"></b><span id="h2"></span></div></div></div>
<nav><div class="wrap"><button class="burger" style="display:none" onclick="document.getElementById('mn').classList.toggle('open')">☰</button><ul id="mn"></ul><button onclick="setL()" id="lb"></button><a class="cta" href="#contact" id="cta"></a></div></nav>
<main id="app"></main>
<footer id="ftr"><div class="wrap"><div class="cols" id="ft"></div><div class="cp" id="cp"></div></div></footer>
<script>
const T={vi:{home:"Trang chủ",about:"Giới thiệu",products:"Sản phẩm",application:"Ứng dụng",news:"Tin tức",contact:"Liên hệ",adv:"Tư vấn ngay",all:"Tất cả",ourP:["Sản phẩm ","của chúng tôi"],band:["Chúng tôi cung cấp ","thiết bị và giải pháp đáng tin cậy."],start:"BẮT ĐẦU DỰ ÁN",video:"Video",videoT:"Xem video để hiểu tổng quan về chúng tôi",latest:["Tin ","mới nhất"],cust:["Khách hàng ","của chúng tôi"],more:"Xem thêm »",none:"Chưa có nội dung.",back:"‹ Quay lại",cat:"Danh mục",addr:"Địa chỉ",mail:"Gửi email cho chúng tôi",hrs:"Giờ làm việc",name:"Họ tên",phone:"Điện thoại",email:"Email",country:"Quốc gia",msg:"Nội dung",send:"Gửi",thanks:"Cảm ơn bạn! Chúng tôi sẽ liên hệ sớm.",lang:"🌐 English",qk:"Liên kết nhanh",pc:"Danh mục sản phẩm"},
en:{home:"Home",about:"About Us",products:"Products",application:"Application",news:"News",contact:"Contact Us",adv:"Find Advisor",all:"All Products",ourP:["Our ","Products"],band:["We provide reliable ","fluid equipment and solutions."],start:"START A PROJECT",video:"Video",videoT:"Please view the video to have the general idea of us",latest:["Latest ","News"],cust:["Our Valued ","Customers"],more:"Read More »",none:"No content yet.",back:"‹ Back",cat:"Categories",addr:"Address",mail:"Send Your Mail At",hrs:"Working Hours",name:"Name",phone:"Phone",email:"Email",country:"Country",msg:"Message",send:"Submit",thanks:"Thank you! We will contact you soon.",lang:"🌐 Tiếng Việt",qk:"Quick Links",pc:"Product Category"}};
let lang=localStorage.lang||"vi",S={},A=[],hc="all";const $=i=>document.getElementById(i),t=()=>T[lang];
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pk=(o,k)=>(lang=="en"?(o[k+"_en"]||o[k]):(o[k]||o[k+"_en"]))||"";
const fd=d=>{const x=new Date(d);return isNaN(x)?d:x.toLocaleDateString(lang=="vi"?"vi-VN":"en-GB")};
const G=ty=>A.filter(x=>x.type==ty),CT=ty=>[...new Map(G(ty).filter(x=>x.cat).map(x=>[x.cat,x])).values()],E=encodeURIComponent;
const PG=()=>G("pgroup"),fg=p=>PG().find(g=>g.slug==p.cat||g.title==p.cat),pcat=p=>{const g=fg(p);return g?g.slug:p.cat},catL=p=>p.type=="product"?(fg(p)?pk(fg(p),"title"):""):pk(p,"cat"),cats=ty=>ty=="product"?PG().map(g=>({k:g.slug,l:pk(g,"title")})):CT(ty).map(c=>({k:c.cat,l:pk(c,"cat")}));
const im=x=>x.cover?`<img src="${x.cover}" alt="" loading="lazy">`:esc(pk(x,"title"));
const card=x=>`<div class="card" onclick="location.hash='item/${x.slug}'"><div class="im">${im(x)}</div><h3>${esc(pk(x,"title"))}</h3><p>${esc(pk(x,"excerpt"))}</p></div>`;
const nw=x=>`<div class="nw card" onclick="location.hash='item/${x.slug}'"><div class="im">${x.cover?`<img src="${x.cover}" alt="">`:""}</div><div class="b"><small>${fd(x.created)}</small><h3>${esc(pk(x,"title"))}</h3><p style="font-size:14px">${esc(pk(x,"excerpt"))}</p></div><div class="m">${t().more}</div></div>`;
const tabs=(l,cur,fn)=>`<div class="tabs">${l.map(i=>`<button class="${cur==i[0]?'on':''}" onclick="${fn}(decodeURIComponent('${E(i[0])}'))"><span>${esc(i[1])}</span></button>`).join("")}</div>`;
const ban=(a,b)=>`<div class="ban"><div class="wrap">${esc(a)}</div></div><div class="crumb"><div class="wrap">${t().home} › ${esc(b)}</div></div>`;
const side=(ty,cur)=>`<aside><h4>${t().cat}</h4><ul><li class="${cur?'':'on'}" onclick="location.hash='${ty}'">${t().all}</li>${cats(ty).map(c=>`<li class="${c.k==cur?'on':''}" onclick="location.hash='${ty}/${E(c.k)}'">${esc(c.l)}</li>`).join("")}</ul></aside>`;
function fm(){const x=t();return `<form onsubmit="return sendF(this)"><input name="name" placeholder="* ${x.name}" required><input name="phone" placeholder="* ${x.phone}" required><input name="email" type="email" placeholder="* ${x.email}" required><input name="country" placeholder="* ${x.country}"><textarea name="message" rows="4" placeholder="* ${x.msg}" required></textarea><button>${x.send}</button></form>`}
function sendF(f){fetch("/api/contact",{method:"POST",body:JSON.stringify(Object.fromEntries(new FormData(f)))}).then(()=>{alert(t().thanks);f.reset()});return false}
const R={
home(){const x=t(),ps=G("product").filter(p=>hc=="all"||pcat(p)==hc).slice(0,6),vd=S.video;
 return `<section>${S.hero_img?`<img src="${S.hero_img}" style="width:100%;display:block" alt="">`:`<div class="ph" style="aspect-ratio:1920/700;border-radius:0">Banner</div>`}</section>
 <section class="sec"><div class="wrap"><h2><em>${x.ourP[0]}</em>${x.ourP[1]}</h2><div class="bar"></div>${tabs([["all",x.all],...cats("product").map(c=>[c.k,c.l])],hc,"setHc")}<div class="grid">${ps.map(card).join("")||x.none}</div></div></section>
 <section class="band"><div class="wrap"><p>${x.band[0]}<b>${x.band[1]}</b></p><a class="btn" href="#contact">${x.start}</a></div></section>
 <section class="sec"><div class="wrap two"><div><h2><em>${x.video}</em></h2><div class="bar"></div><p style="margin-bottom:24px;font-size:18px">${x.videoT}</p><a class="btn" href="#contact">${x.contact}</a></div>${vd?`<iframe src="${esc(vd)}" style="width:100%;aspect-ratio:16/9;border:0" allowfullscreen></iframe>`:`<div class="ph">▶ Video</div>`}</div></section>
 <section class="sec" style="padding-top:0"><div class="wrap"><h2><em>${x.latest[0]}</em>${x.latest[1]}</h2><div class="bar"></div><div class="grid">${G("news").slice(0,3).map(nw).join("")||x.none}</div></div></section>
 ${G("customer").length?`<section class="sec" style="padding-top:0"><div class="wrap"><h2><em>${x.cust[0]}</em>${x.cust[1]}</h2><div class="bar"></div><div class="logos">${G("customer").map(c=>`<div>${c.cover?`<img src="${c.cover}" alt="${esc(c.title)}">`:esc(pk(c,"title"))}</div>`).join("")}</div></div></section>`:""}`},
products(c){c=c?decodeURIComponent(c):"";const x=t();return ban(x.products,x.products)+`<section class="sec"><div class="wrap"><p class="c" style="margin-bottom:30px">${esc(pk(S,"products_intro"))}</p><div class="side">${side("product",c)}<div class="grid" style="grid-template-columns:repeat(3,1fr)">${G("product").filter(p=>!c||pcat(p)==c).map(card).join("")||x.none}</div></div></div></section>`},
application(c){c=c?decodeURIComponent(c):"";const x=t();return ban(x.application,x.application)+`<section class="sec"><div class="wrap">${tabs([["",x.all],...CT("application").map(k=>[k.cat,pk(k,"cat")])],c,"(k=>location.hash='application/'+encodeURIComponent(k))")}<div class="grid">${G("application").filter(p=>!c||p.cat==c).map(nw).join("")||x.none}</div></div></section>`},
news(c){c=c?decodeURIComponent(c):"";const x=t();return ban(x.news,x.news)+`<section class="sec"><div class="wrap side"><div>${G("news").filter(p=>!c||p.cat==c).map(n=>`<div class="row" onclick="location.hash='item/${n.slug}'"><div class="im">${n.cover?`<img src="${n.cover}" alt="">`:""}</div><div><h3>${esc(pk(n,"title"))}</h3><small>${fd(n.created)}</small><p>${esc(pk(n,"excerpt"))}</p></div></div>`).join("")||x.none}</div>${side("news",c)}</div></section>`},
async item(s){const r=await fetch("/api/items/"+s);if(!r.ok)return `<section class="sec"><div class="wrap">${t().none}</div></section>`;const p=await r.json();document.title=pk(p,"title");
 return `<section class="sec"><div class="wrap art"><a href="javascript:history.back()" style="color:var(--blue)">${t().back}</a><h1>${esc(pk(p,"title"))}</h1><small>${esc(catL(p))} ${["news","application"].includes(p.type)?"· "+fd(p.created):""}</small>${p.cover?`<img src="${p.cover}" style="width:100%;margin:20px 0" alt="">`:""}<div class="c">${pk(p,"body")}</div></div></section>`},
async about(s){const L=G("about"),x=t();s=s||(L[0]&&L[0].slug);let b="";if(s){const r=await fetch("/api/items/"+s);if(r.ok)b=pk(await r.json(),"body")}
 return ban(x.about,x.about)+`<div class="wrap" style="padding-top:30px"><div class="sub">${L.map(a=>`<a href="#about/${a.slug}" class="${a.slug==s?'on':''}">${esc(pk(a,"title"))}</a>`).join("")}</div><div class="sec c" style="padding-top:10px">${b||x.none}</div></div>`},
contact(){const x=t();return ban(x.contact,x.contact)+`<section class="sec"><div class="wrap two"><div class="c"><p><b>${x.addr}:</b> ${esc(pk(S,"address"))}</p><p><b>${x.phone}:</b> ${esc(S.phone)}</p><p><b>Email:</b> <a href="mailto:${esc(S.email)}">${esc(S.email)}</a></p><p><b>${x.hrs}:</b> ${esc(pk(S,"hours"))}</p></div>${fm()}</div></section>`}};
const setHc=c=>{hc=c;go()};
function setL(){lang=lang=="vi"?"en":"vi";localStorage.lang=lang;go()}
function chrome(){const x=t(),h=location.hash.slice(1),p=h.split("/")[0];document.documentElement.lang=lang;
 if(S.favicon)$("fav").href=S.favicon;$("ftr").style.background=S.footer_bg?`linear-gradient(rgba(10,37,64,.88),rgba(10,37,64,.88)),url(${S.footer_bg}) center/cover`:"";$("wel").textContent=pk(S,"welcome");$("hot").textContent=pk(S,"hotline")+" "+(S.phone||"");
 $("logo").innerHTML=S.logo_img?`<img src="${S.logo_img}" alt="">`:esc(S.brand||"LOGO");document.title=S.brand||"Website";
 $("a1").textContent=x.addr;$("a2").textContent=pk(S,"address");$("m1").textContent=x.mail;$("m2").textContent=S.email||"";$("h1").textContent=x.hrs;$("h2").textContent=pk(S,"hours");
 const dd=(l,f)=>l.length?`<div class="dd">${l.map(f).join("")}</div>`:"";const li=(k,d="")=>`<li><a href="#${k}" class="${p==k||(k=="home"&&!p)?'on':''}">${x[k]}</a>${d}</li>`;
 $("mn").innerHTML=li("home")+li("about",dd(G("about"),a=>`<a href="#about/${a.slug}">${esc(pk(a,"title"))}</a>`))+li("products",dd(cats("product"),c=>`<a href="#products/${E(c.k)}">${esc(c.l)}</a>`))+li("application",dd(CT("application"),c=>`<a href="#application/${E(c.cat)}">${esc(pk(c,"cat"))}</a>`))+li("news",dd(CT("news"),c=>`<a href="#news/${E(c.cat)}">${esc(pk(c,"cat"))}</a>`))+li("contact");
 $("lb").textContent=x.lang;$("cta").textContent=x.adv+"  →";
 $("ft").innerHTML=`<div><div class="logo">${S.footer_logo?`<img src="${S.footer_logo}" style="height:64px" alt="">`:S.logo_img?`<img src="${S.logo_img}" style="height:56px;background:#fff;padding:6px;border-radius:4px" alt="">`:esc(S.brand)}</div><p style="margin-top:12px">${esc(pk(S,"intro"))}</p></div><div><h4>${x.pc}</h4><ul>${cats("product").map(c=>`<li onclick="location.hash='products/${E(c.k)}'">▸ ${esc(c.l)}</li>`).join("")}</ul></div><div><h4>${x.qk}</h4><ul>${["about","products","application","news","contact"].map(k=>`<li onclick="location.hash='${k}'">${x[k]}</li>`).join("")}</ul></div><div><h4>${x.contact}</h4>${fm()}</div>`;
 $("cp").textContent="© "+new Date().getFullYear()+" "+(S.brand||"")}
async function go(){const h=location.hash.slice(1)||"home",i=h.indexOf("/"),p=i<0?h:h.slice(0,i),a=i<0?"":h.slice(i+1);chrome();$("app").innerHTML=await (R[p]||R.home)(a);$("mn").classList.remove("open")}
addEventListener("hashchange",()=>{go();scrollTo(0,0)});
Promise.all([fetch("/api/settings").then(r=>r.json()),fetch("/api/items").then(r=>r.json())]).then(([s,a])=>{S=s;A=Array.isArray(a)?a:[];go()}).catch(()=>{$("app").innerHTML="<p style='padding:60px 15px'>Chưa kết nối cơ sở dữ liệu.</p>"});
</script></body></html>
