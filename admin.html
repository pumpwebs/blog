<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Quản trị</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f5f8;margin:0;color:#333}header{background:#000;color:#fff;padding:14px 20px;display:flex;gap:14px;align-items:center}header b{color:#4da3ff;font-size:20px;flex:1}
button,.b{background:#0b4ea2;color:#fff;border:0;padding:9px 18px;cursor:pointer;border-radius:4px;font-size:14px}button.g{background:#888}button.r{background:#c0392b}
main{max-width:980px;margin:20px auto;padding:0 15px}.box{background:#fff;padding:22px;border-radius:6px;margin-bottom:16px;box-shadow:0 1px 4px #0002}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font:inherit;margin:4px 0 12px}label{font-weight:700;font-size:14px}
.row{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.row div{flex:1}.tag{background:#eee;padding:2px 8px;border-radius:10px;font-size:12px}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}.tb button{padding:6px 12px;background:#444}.ed{min-height:300px;border:1px solid #ccc;padding:14px;background:#fff;border-radius:4px;line-height:1.6}.ed img{max-width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hide{display:none}#login{max-width:360px;margin:100px auto}</style></head><body>
<div id="login" class="box"><h2>Đăng nhập quản trị</h2><label>Mật khẩu</label><input id="pw" type="password" onkeydown="if(event.key=='Enter')login()"><button onclick="login()">Đăng nhập</button></div>
<div id="app" class="hide"><header><b>⚙ Quản trị</b><button onclick="tab('list')">Bài viết</button><button onclick="tab('set')">Cài đặt web</button><a href="/" target="_blank" style="color:#fff">Xem web ↗</a><button class="g" onclick="sessionStorage.clear();location.reload()">Thoát</button></header>
<main>
<div id="v_list"></div>
<div id="v_edit" class="hide"><div class="box"><h3 id="et">Bài viết</h3>
<div class="two"><div><label>Tiêu đề (Tiếng Việt) *</label><input id="f_title"></div><div><label>Title (English, tùy chọn)</label><input id="f_title_en"></div></div>
<div class="two"><div><label>Chuyên mục</label><input id="f_cat" placeholder="VD: Tin tức"></div><div><label>Ngày đăng</label><input id="f_date" type="date"></div></div>
<label>Ảnh bìa</label><input type="file" accept="image/*" onchange="cover(this)"><input id="f_cover" placeholder="Link ảnh bìa (tự điền sau khi chọn ảnh)">
<div class="two"><div><label>Mô tả ngắn (VI)</label><textarea id="f_ex" rows="2"></textarea></div><div><label>Short description (EN)</label><textarea id="f_ex_en" rows="2"></textarea></div></div>
<div class="tb"><button class="g" id="lv" onclick="sw('vi')">Nội dung: Tiếng Việt</button><button class="g" id="le" onclick="sw('en')">Content: English</button><span style="flex:1"></span>
<button onmousedown="event.preventDefault();c('bold')"><b>B</b></button><button onmousedown="event.preventDefault();c('italic')"><i>I</i></button><button onmousedown="event.preventDefault();c('formatBlock','h2')">Tiêu đề</button><button onmousedown="event.preventDefault();c('formatBlock','p')">Đoạn</button><button onmousedown="event.preventDefault();c('insertUnorderedList')">• Danh sách</button><button onmousedown="event.preventDefault();lk()">Link</button><label class="b" style="margin:0;font-weight:400">🖼 Chèn ảnh<input type="file" accept="image/*" class="hide" onchange="ins(this)"></label></div>
<div id="ed_vi" class="ed" contenteditable></div><div id="ed_en" class="ed hide" contenteditable></div>
<p><label><input id="f_pub" type="checkbox" checked style="width:auto"> Hiển thị công khai (bỏ tick = lưu nháp)</label></p>
<button onclick="save()">💾 Lưu bài</button> <button class="g" onclick="tab('list')">Hủy</button></div></div>
<div id="v_set" class="hide"><div class="box"><h3>Cài đặt website</h3><div id="sf"></div><button onclick="saveSet()">💾 Lưu cài đặt</button></div></div>
</main></div>
<script>
let pw=sessionStorage.pw||"",cur={},rng=null,cl="vi",$=s=>document.querySelector(s);
const H=()=>({"x-admin":pw,"content-type":"application/json"});
async function api(u,o={}){const r=await fetch(u,{...o,headers:H()});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d}
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function login(){pw=$("#pw").value;try{await api("/api/login",{method:"POST"});sessionStorage.pw=pw;start()}catch(e){alert("Sai mật khẩu, hoặc chưa cài ADMIN_PASSWORD / cơ sở dữ liệu (xem hướng dẫn).")}}
function start(){$("#login").classList.add("hide");$("#app").classList.remove("hide");tab("list")}
function tab(n){["list","edit","set"].forEach(k=>$("#v_"+k).classList.toggle("hide",k!=n));if(n=="list")lst();if(n=="set")sets()}
async function lst(){const p=await api("/api/posts");$("#v_list").innerHTML=`<div class="box"><button onclick="edit()">＋ Viết bài mới</button><div style="margin-top:14px">${p.map(x=>`<div class="row"><div><b>${esc(x.title)}</b><br><small>${esc(x.cat)} · ${x.created}</small> ${x.published?"":'<span class="tag">Nháp</span>'}</div><button onclick="edit('${x.slug}')">Sửa</button><button class="r" onclick="del(${x.id})">Xóa</button></div>`).join("")||"Chưa có bài."}</div></div>`}
async function edit(slug){cur=slug?await api("/api/posts/"+slug):{published:1,created:new Date().toISOString().slice(0,10)};
 $("#et").textContent=slug?"Sửa bài viết":"Bài viết mới";
 for(const [k,i] of [["title","f_title"],["title_en","f_title_en"],["cat","f_cat"],["created","f_date"],["cover","f_cover"],["excerpt","f_ex"],["excerpt_en","f_ex_en"]])$("#"+i).value=cur[k]||"";
 $("#f_pub").checked=!!cur.published;$("#ed_vi").innerHTML=cur.body||"";$("#ed_en").innerHTML=cur.body_en||"";sw("vi");tab("edit")}
function sw(l){cl=l;$("#ed_vi").classList.toggle("hide",l!="vi");$("#ed_en").classList.toggle("hide",l!="en");$("#lv").style.background=l=="vi"?"#0b4ea2":"#888";$("#le").style.background=l=="en"?"#0b4ea2":"#888"}
document.addEventListener("selectionchange",()=>{const s=getSelection();if(s.rangeCount&&s.anchorNode&&s.anchorNode.parentElement&&s.anchorNode.parentElement.closest(".ed"))rng=s.getRangeAt(0)});
const ed=()=>$("#ed_"+cl);
function c(a,v){ed().focus();document.execCommand(a,false,v)}
function lk(){const u=prompt("Dán đường link (https://...)");if(u)c("createLink",u)}
const shrink=f=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,1280/i.width),cv=document.createElement("canvas");cv.width=i.width*k;cv.height=i.height*k;cv.getContext("2d").drawImage(i,0,0,cv.width,cv.height);r(cv.toDataURL("image/jpeg",.8))};i.src=URL.createObjectURL(f)});
async function up(f){const d=await shrink(f);const r=await fetch("/api/img",{method:"POST",headers:H(),body:d});const j=await r.json();if(!r.ok)throw new Error(j.error);return j.url}
async function cover(i){try{$("#f_cover").value=await up(i.files[0])}catch(e){alert("Lỗi tải ảnh: "+e.message)}}
async function ins(i){try{const u=await up(i.files[0]);ed().focus();if(rng){const s=getSelection();s.removeAllRanges();s.addRange(rng)}document.execCommand("insertImage",false,u)}catch(e){alert("Lỗi tải ảnh: "+e.message)}i.value=""}
async function save(){if(!$("#f_title").value.trim())return alert("Nhập tiêu đề");
 const b={id:cur.id,title:$("#f_title").value,title_en:$("#f_title_en").value,cat:$("#f_cat").value,created:$("#f_date").value,cover:$("#f_cover").value,excerpt:$("#f_ex").value,excerpt_en:$("#f_ex_en").value,body:$("#ed_vi").innerHTML,body_en:$("#ed_en").innerHTML,published:$("#f_pub").checked};
 try{await api("/api/posts",{method:"POST",body:JSON.stringify(b)});alert("Đã lưu!");tab("list")}catch(e){alert("Lỗi: "+e.message)}}
async function del(id){if(confirm("Xóa bài này?")){await api("/api/posts/"+id,{method:"DELETE"});lst()}}
const SF=[["brand","Tên thương hiệu (logo)"],["phone","Điện thoại"],["email","Email"],["address","Địa chỉ"],["hours","Giờ làm việc"],["hero","Tiêu đề lớn trang chủ (VI)"],["hero_en","Tiêu đề lớn (EN)"],["sub","Câu giới thiệu ngắn (VI)"],["sub_en","Câu giới thiệu (EN)"],["about","Nội dung trang Giới thiệu (VI)"],["about_en","About page (EN)"]];
async function sets(){const s=await fetch("/api/settings").then(r=>r.json());$("#sf").innerHTML=SF.map(([k,l])=>`<label>${l}</label>${k.startsWith("about")?`<textarea id="s_${k}" rows="6">${esc(s[k])}</textarea>`:`<input id="s_${k}" value="${esc(s[k])}">`}`).join("")}
async function saveSet(){const o={};SF.forEach(([k])=>o[k]=$("#s_"+k).value);try{await api("/api/settings",{method:"POST",body:JSON.stringify(o)});alert("Đã lưu!")}catch(e){alert("Lỗi: "+e.message)}}
if(pw)api("/api/login",{method:"POST"}).then(start).catch(()=>{});
</script></body></html>
