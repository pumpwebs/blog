<!DOCTYPE html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Quản trị</title>
<style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#f3f5f8;margin:0;color:#333}header{background:#000;color:#fff;padding:12px 20px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}header b{color:#4da3ff;font-size:20px;margin-right:10px}
button,.b{background:#0b4ea2;color:#fff;border:0;padding:9px 16px;cursor:pointer;border-radius:4px;font-size:14px}button.g{background:#888}button.r{background:#c0392b}header button.on{background:#4da3ff;color:#000}
main{max-width:1000px;margin:20px auto;padding:0 15px}.box{background:#fff;padding:22px;border-radius:6px;margin-bottom:16px;box-shadow:0 1px 4px #0002}
input,textarea,select{width:100%;padding:10px;border:1px solid #ccc;border-radius:4px;font:inherit;margin:4px 0 12px}label{font-weight:700;font-size:14px}
.row{display:flex;gap:12px;align-items:center;border-bottom:1px solid #eee;padding:12px 0}.row>div{flex:1}.row img{width:60px;height:45px;object-fit:cover}.tag{background:#eee;padding:2px 8px;border-radius:10px;font-size:12px}
.tb{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px;align-items:center}.tb button{padding:6px 12px;background:#444}.ed{min-height:280px;border:1px solid #ccc;padding:14px;background:#fff;border-radius:4px;line-height:1.6}.ed img{max-width:100%}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.hide{display:none!important}#login{max-width:360px;margin:100px auto}.note{background:#eef5ff;padding:10px;border-radius:4px;font-size:13px;margin-bottom:14px}</style></head><body>
<div id="login" class="box"><h2>Đăng nhập quản trị</h2><label>Mật khẩu</label><input id="pw" type="password" onkeydown="if(event.key=='Enter')login()"><button onclick="login()">Đăng nhập</button></div>
<div id="app" class="hide"><header id="hd"></header><main>
<div id="v_list"></div>
<div id="v_edit" class="hide"><div class="box"><h3 id="et"></h3>
<div class="two"><div><label>Tiêu đề (Tiếng Việt)</label><input id="f_title"></div><div><label>Title (English)</label><input id="f_title_en"></div></div>
<div id="w_grp"><label>Nhóm sản phẩm *</label><select id="f_grp"></select></div>
<div id="w_cat" class="two"><div><label>Danh mục / Nhóm (Tiếng Việt)</label><input id="f_cat" placeholder="VD: Bơm ly tâm"></div><div><label>Category (English)</label><input id="f_cat_en"></div></div>
<div class="two"><div id="w_date"><label>Ngày đăng</label><input id="f_date" type="date"></div><div><label>Thứ tự hiển thị (số nhỏ hiện trước)</label><input id="f_sort" type="number" value="0"></div></div>
<div id="w_cover"><label>Ảnh đại diện</label><input type="file" accept="image/*" onchange="cover(this)"><input id="f_cover" placeholder="Link ảnh (tự điền sau khi chọn ảnh)"></div>
<div id="w_ex" class="two"><div><label>Mô tả ngắn (VI)</label><textarea id="f_ex" rows="2"></textarea></div><div><label>Short description (EN)</label><textarea id="f_ex_en" rows="2"></textarea></div></div>
<div id="w_body"><div class="tb"><button class="g" id="lv" onclick="sw('vi')">Nội dung: Tiếng Việt</button><button class="g" id="le" onclick="sw('en')">Content: English</button><span style="flex:1"></span>
<button onmousedown="event.preventDefault();c('bold')"><b>B</b></button><button onmousedown="event.preventDefault();c('italic')"><i>I</i></button><button onmousedown="event.preventDefault();c('formatBlock','h2')">Tiêu đề</button><button onmousedown="event.preventDefault();c('formatBlock','p')">Đoạn</button><button onmousedown="event.preventDefault();c('insertUnorderedList')">• Danh sách</button><button onmousedown="event.preventDefault();lk()">Link</button><label class="b" style="margin:0;font-weight:400">🖼 Chèn ảnh<input type="file" accept="image/*" class="hide" onchange="ins(this)"></label></div>
<div id="ed_vi" class="ed" contenteditable></div><div id="ed_en" class="ed hide" contenteditable></div></div>
<p><label><input id="f_pub" type="checkbox" checked style="width:auto"> Hiển thị công khai (bỏ tick = lưu nháp)</label></p>
<label>Dịch tự động</label><select id="f_tr"><option value="fill">Tự điền phần còn trống (khuyên dùng)</option><option value="vi2en">Dịch lại từ Tiếng Việt → English (ghi đè)</option><option value="en2vi">Dịch lại từ English → Tiếng Việt (ghi đè)</option><option value="none">Không dịch</option></select>
<button id="sv" onclick="save()">💾 Lưu</button> <button class="g" onclick="lst(ty)">Hủy</button></div></div>
<div id="v_set" class="hide"><div class="box"><h3>Cài đặt website</h3><div class="note">Chỉ cần điền một ngôn ngữ, ngôn ngữ còn lại được tự dịch khi lưu.</div><div id="sf"></div><button id="ss" onclick="saveSet()">💾 Lưu cài đặt</button></div></div>
<div id="v_msg" class="hide"></div><div id="v_contact" class="hide"></div><div id="v_seed" class="hide"></div>
</main></div>
<script>
let pw=sessionStorage.pw||"",cur={},ty="product",cl="vi",rng=null,$=s=>document.querySelector(s);
const TY={pgroup:"Nhóm sản phẩm",product:"Sản phẩm",application:"Ứng dụng",news:"Tin tức",about:"Giới thiệu",customer:"Khách hàng"};
const SHOW={pgroup:"cover body",product:"grp cover ex body",application:"cat cover ex body date",news:"cat cover ex body date",about:"body",customer:"cover"};
const H=()=>({"x-admin":pw,"content-type":"application/json"});
async function api(u,o={}){const r=await fetch(u,{...o,headers:H()});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||r.status);return d}
const esc=s=>String(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
async function login(){pw=$("#pw").value;try{await api("/api/login",{method:"POST"});sessionStorage.pw=pw;start()}catch(e){alert("Sai mật khẩu hoặc chưa cài ADMIN_PASSWORD.")}}
function start(){$("#login").classList.add("hide");$("#app").classList.remove("hide");
 $("#hd").innerHTML="<b>⚙ Quản trị</b>"+Object.entries(TY).map(([k,v])=>`<button data-k="${k}" onclick="lst('${k}')">${v}</button>`).join("")+`<button data-k="contact" onclick="contactTab()">Liên hệ</button><button data-k="msg" onclick="msgs()">Tin nhắn</button><button class="g" data-k="seed" onclick="seedTab()">📥 Dữ liệu mẫu</button><button data-k="set" onclick="sets()">Cài đặt web</button><span style="flex:1"></span><a href="/" target="_blank" style="color:#fff">Xem web ↗</a> <button class="g" onclick="sessionStorage.clear();location.reload()">Thoát</button>`;lst("product")}
function view(n,k){["list","edit","set","msg","contact","seed"].forEach(x=>$("#v_"+x).classList.toggle("hide",x!=n));document.querySelectorAll("#hd button[data-k]").forEach(b=>b.classList.toggle("on",b.dataset.k==k))}
async function lst(t){ty=t;view("list",t);const p=await api("/api/items?type="+t);let h;
 const row=x=>`<div class="row">${x.cover?`<img src="${x.cover}">`:""}<div><b>${esc(x.title||x.title_en)}</b><br><small>${t=="product"?"":esc(x.cat)} ${["news","application"].includes(t)?"· "+x.created:""}</small> ${x.published?"":'<span class="tag">Nháp</span>'}</div><button onclick="edit('${x.slug}')">Sửa</button><button class="r" onclick="del(${x.id})">Xóa</button></div>`;
 if(t=="product"){const gs=await api("/api/items?type=pgroup"),used=new Set();
  h=gs.map(g=>{const l=p.filter(x=>x.cat==g.slug||x.cat==g.title);l.forEach(x=>used.add(x.id));return `<h4 style="margin:22px 0 4px;background:#eef5ff;padding:10px;border-radius:4px">📁 ${esc(g.title||g.title_en)} (${l.length}) <button style="float:right;padding:5px 12px" onclick="edit(null,'${g.slug}')">＋ Thêm sản phẩm vào nhóm này</button></h4>${l.map(row).join("")||"<small>Chưa có sản phẩm.</small>"}`}).join("");
  const rest=p.filter(x=>!used.has(x.id));if(rest.length)h+=`<h4 style="margin-top:22px">Chưa thuộc nhóm nào</h4>`+rest.map(row).join("");
  if(!gs.length)h="<p>Chưa có nhóm nào. Bấm tab <b>Nhóm sản phẩm</b> để tạo nhóm trước.</p>"}
 else h=p.map(row).join("")||"Chưa có mục nào.";
 $("#v_list").innerHTML=`<div class="box"><h3>${TY[t]}</h3><button onclick="edit()">＋ Thêm ${t=="pgroup"?"nhóm":"mới"}</button><div style="margin-top:14px">${h}</div></div>`}
async function edit(slug,pre){cur=slug?await api("/api/items/"+slug):{published:1,created:new Date().toISOString().slice(0,10),sort:0};
 if(ty=="product"){const gs=await api("/api/items?type=pgroup");if(!gs.length){alert("Hãy tạo ít nhất một Nhóm sản phẩm trước.");return lst("pgroup")}
  $("#f_grp").innerHTML=gs.map(g=>`<option value="${g.slug}">${esc(g.title||g.title_en)}</option>`).join("");
  $("#f_grp").value=(gs.find(g=>g.slug==(pre||cur.cat)||g.title==cur.cat)||gs[0]).slug}
 $("#et").textContent=TY[ty]+(slug?" – Sửa":" – Thêm mới");
 for(const [k,i] of [["title","f_title"],["title_en","f_title_en"],["cat","f_cat"],["cat_en","f_cat_en"],["created","f_date"],["cover","f_cover"],["excerpt","f_ex"],["excerpt_en","f_ex_en"],["sort","f_sort"]])$("#"+i).value=cur[k]??"";
 $("#f_pub").checked=!!cur.published;$("#ed_vi").innerHTML=cur.body||"";$("#ed_en").innerHTML=cur.body_en||"";$("#f_tr").value="fill";
 ["cat","grp","cover","ex","body","date"].forEach(k=>$("#w_"+k).classList.toggle("hide",!SHOW[ty].split(" ").includes(k)));sw("vi");view("edit",ty)}
function sw(l){cl=l;$("#ed_vi").classList.toggle("hide",l!="vi");$("#ed_en").classList.toggle("hide",l!="en");$("#lv").style.background=l=="vi"?"#0b4ea2":"#888";$("#le").style.background=l=="en"?"#0b4ea2":"#888"}
document.addEventListener("selectionchange",()=>{const s=getSelection();if(s.rangeCount&&s.anchorNode&&s.anchorNode.parentElement&&s.anchorNode.parentElement.closest(".ed"))rng=s.getRangeAt(0)});
const ed=()=>$("#ed_"+cl);function c(a,v){ed().focus();document.execCommand(a,false,v)}
function lk(){const u=prompt("Dán đường link (https://...)");if(u)c("createLink",u)}
const shrink=(f,mx=1280,ty="image/jpeg")=>new Promise(r=>{const i=new Image();i.onload=()=>{const k=Math.min(1,mx/i.width),cv=document.createElement("canvas");cv.width=i.width*k;cv.height=i.height*k;cv.getContext("2d").drawImage(i,0,0,cv.width,cv.height);r(cv.toDataURL(ty,.85))};i.src=URL.createObjectURL(f)});
async function up(f,mx,ty){const d=await shrink(f,mx,ty);const r=await fetch("/api/img",{method:"POST",headers:H(),body:d});const j=await r.json();if(!r.ok)throw new Error(j.error);return j.url}
async function cover(i){try{$("#f_cover").value=await up(i.files[0])}catch(e){alert("Lỗi tải ảnh: "+e.message)}}
async function ins(i){try{const u=await up(i.files[0]);ed().focus();if(rng){const s=getSelection();s.removeAllRanges();s.addRange(rng)}document.execCommand("insertImage",false,u)}catch(e){alert("Lỗi tải ảnh: "+e.message)}i.value=""}
/* ---- dịch tự động ---- */
const emp=v=>!v||(!/<img/.test(v)&&!v.replace(/<[^>]*>|&nbsp;/g,"").trim());
async function trTexts(a,f,t){const o=[];for(let i=0;i<a.length;i+=15)o.push(...(await api("/api/translate",{method:"POST",body:JSON.stringify({texts:a.slice(i,i+15),from:f,to:t})})).texts);return o}
async function trField(v,f,t,html){if(!html)return (await trTexts(v.split("\n"),f,t)).join("\n");
 const ps=v.split(/(<[^>]+>)/),ix=[],tx=[];ps.forEach((p,i)=>{if(p&&p[0]!="<"&&p.replace(/&nbsp;/g,"").trim()){ix.push(i);tx.push(p)}});
 const o=await trTexts(tx,f,t);ix.forEach((k,j)=>ps[k]=o[j]);return ps.join("")}
async function autoTr(o,F,mode,q){if(mode=="none")return;let err=0;
 for(const [k,h] of F){const a=o[k],b=o[k+"_en"];let d=null;
  if(mode=="vi2en"&&!emp(a))d="vi";else if(mode=="en2vi"&&!emp(b))d="en";
  else if(mode=="fill"){if(!emp(a)&&emp(b))d="vi";else if(emp(a)&&!emp(b))d="en"}
  try{if(d=="vi")o[k+"_en"]=await trField(a,"vi","en",h);else if(d=="en")o[k]=await trField(b,"en","vi",h)}catch(e){err=1}}
 if(err&&!q)alert("Một phần chưa dịch được (hết hạn mức dịch miễn phí?). Dữ liệu vẫn được lưu, bạn có thể tự nhập bản dịch.")}
async function save(){const g=i=>$("#"+i).value,b={id:cur.id,type:ty,title:g("f_title"),title_en:g("f_title_en"),cat:ty=="product"?g("f_grp"):g("f_cat"),cat_en:ty=="product"?"":g("f_cat_en"),created:g("f_date"),cover:g("f_cover"),excerpt:g("f_ex"),excerpt_en:g("f_ex_en"),body:$("#ed_vi").innerHTML,body_en:$("#ed_en").innerHTML,sort:+g("f_sort")||0,published:$("#f_pub").checked};
 if(!b.title.trim()&&!b.title_en.trim())return alert("Nhập tiêu đề");
 const bt=$("#sv");bt.disabled=true;bt.textContent="Đang dịch & lưu…";
 try{await autoTr(b,[["title",0],["excerpt",0],...(ty=="product"?[]:[["cat",0]]),["body",1]],g("f_tr"));await api("/api/items",{method:"POST",body:JSON.stringify(b)});lst(ty)}catch(e){alert("Lỗi: "+e.message)}
 bt.disabled=false;bt.textContent="💾 Lưu"}
async function del(id){if(confirm("Xóa mục này?")){await api("/api/items/"+id,{method:"DELETE"});lst(ty)}}
/* ---- cài đặt ---- */
const SF=[["logo_img","Logo (ảnh) – nên dùng PNG nền trong suốt, ngang khoảng 300–600px","i",600,"image/png"],["footer_logo","Logo chân trang – PNG nền trong suốt, hợp nền tối (bỏ trống thì dùng logo ở trên)","i",600,"image/png"],["footer_bg","Ảnh nền chân trang (tùy chọn, ảnh tối như trang gốc)","i",1920,"image/jpeg"],["brand","Tên thương hiệu (hiện khi chưa có logo ảnh, và ở tab trình duyệt)"],["favicon","Favicon – biểu tượng nhỏ trên tab trình duyệt (ảnh vuông, vd 256×256)","i",128,"image/png"],["hero_img","Ảnh banner 1 (ảnh ngang, khoảng 1920×700)","i",1920,"image/jpeg"],["hero_img2","Ảnh banner 2 (tùy chọn, cùng kích thước ảnh 1)","i",1920,"image/jpeg"],["hero_img3","Ảnh banner 3 (tùy chọn, cùng kích thước ảnh 1)","i",1920,"image/jpeg"],["video","Link video nhúng YouTube (https://www.youtube.com/embed/…)"]];
const SP=[["seo_title","SEO: tiêu đề trang chủ (≤ 60 ký tự, có từ khóa chính)"],["seo_desc","SEO: mô tả trang chủ (≤ 155 ký tự)","t"],["welcome","Lời chào trên cùng"],["hotline","Dòng hỗ trợ (VD: Cần hỗ trợ?)"],["intro","Giới thiệu ngắn (chân trang)","t"],["products_intro","Đoạn mô tả trang Sản phẩm","t"]];
const inp=(id,v,t)=>t=="t"?`<textarea id="${id}" rows="3">${esc(v)}</textarea>`:`<input id="${id}" value="${esc(v)}">`;
async function sets(){view("set","set");const s=await fetch("/api/settings").then(r=>r.json());
 $("#sf").innerHTML=SF.map(([k,l,t])=>`<label>${l}</label>${t=="i"?`<input type="file" accept="image/*" onchange="sUp(this,'s_${k}')"><img id="p_s_${k}" src="${esc(s[k])}" style="max-height:80px;max-width:100%;background:#7f8fa3;margin:4px 0;${s[k]?"":"display:none"}">`:""}${inp("s_"+k,s[k])}`).join("")+SP.map(([k,l,t])=>`<label>${l}</label><div class="two"><div>${inp("s_"+k,s[k],t)}</div><div>${inp("s_"+k+"_en",s[k+"_en"],t)}</div></div>`).join("")+'<p style="font-size:12px;color:#888">Cột trái: Tiếng Việt · Cột phải: English</p>'}
async function sUp(i,id){try{const f=SF.find(x=>"s_"+x[0]==id),u=await up(i.files[0],f[3],f[4]);$("#"+id).value=u;const p=$("#p_"+id);p.src=u;p.style.display="block"}catch(e){alert("Lỗi: "+e.message)}}
async function saveSet(){const o=await fetch("/api/settings").then(r=>r.json());SF.forEach(([k])=>o[k]=$("#s_"+k).value);SP.forEach(([k])=>{o[k]=$("#s_"+k).value;o[k+"_en"]=$("#s_"+k+"_en").value});
 const bt=$("#ss");bt.disabled=true;bt.textContent="Đang dịch & lưu…";
 try{await autoTr(o,SP.map(([k])=>[k,0]),"fill");await api("/api/settings",{method:"POST",body:JSON.stringify(o)});alert("Đã lưu!");sets()}catch(e){alert("Lỗi: "+e.message)}
 bt.disabled=false;bt.textContent="💾 Lưu cài đặt"}
async function msgs(){view("msg","msg");const m=await api("/api/messages");
 $("#v_msg").innerHTML=`<div class="box"><h3>Tin nhắn từ khách</h3>${m.map(x=>`<div class="row"><div><b>${esc(x.name)}</b> · ${esc(x.phone)} · ${esc(x.email)} · ${esc(x.country)}<br><small>${x.created.slice(0,16).replace("T"," ")}</small><p>${esc(x.msg)}</p></div><button class="r" onclick="dm(${x.id})">Xóa</button></div>`).join("")||"Chưa có tin nhắn."}</div>`}
async function dm(id){await api("/api/messages/"+id,{method:"DELETE"});msgs()}
/* ---- hình minh họa tự vẽ (SVG) ---- */
const R=(x,y,w,h,f,r)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r||0}" fill="${f}"/>`,Ci=(x,y,r,f)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${f}"/>`,B="#1d6fe0",D="#0b4ea2",Gy="#6b7a90",Yl="#f2b705",Kk="#2a3b55",Lt="#cfe0ff",Sv="#8a97aa";
const fins=(x,y,h,n,s)=>Array.from({length:n},(_,i)=>R(x+i*s,y,4,h,D)).join(""),skid=R(70,372,500,20,Kk,4),MOT=R(100,262,170,110,B,14)+fins(120,274,86,8,19)+R(270,300,34,32,Yl);
const PUMP={
cp:()=>skid+MOT+Ci(410,310,70,D)+Ci(410,310,34,Lt)+Ci(410,310,12,Gy)+R(480,288,60,44,Gy,4)+R(396,196,30,50,Gy)+R(380,184,62,14,Sv,3),
split:()=>skid+MOT+R(304,282,236,90,D,34)+R(330,246,184,42,B,16)+R(340,196,38,54,Gy)+R(330,184,58,14,Sv,3)+R(450,196,38,54,Gy)+R(440,184,58,14,Sv,3)+R(520,300,28,44,Kk,4),
multi:()=>skid+MOT+R(304,290,226,66,B,10)+[330,370,410,450,490].map(x=>R(x,284,10,78,D)).join("")+R(520,280,22,90,D,6)+R(340,230,34,60,Gy)+R(330,220,54,12,Sv,3)+R(450,230,34,60,Gy)+R(440,220,54,12,Sv,3),
vert:()=>R(190,372,260,20,Kk,4)+R(250,120,140,250,B,12)+[160,200,240,280,320].map(y=>R(244,y,152,10,D)).join("")+R(262,50,116,80,D,14)+R(296,30,48,24,Gy,6)+R(130,310,64,34,Gy)+R(446,310,64,34,Gy),
inline:()=>R(200,372,240,20,Kk,4)+R(250,60,140,124,B,14)+fins(268,74,96,8,15)+R(300,184,40,34,Yl)+Ci(320,284,64,D)+Ci(320,284,28,Lt)+R(196,266,76,36,Gy)+R(368,266,76,36,Gy)+R(184,258,14,52,Sv)+R(442,258,14,52,Sv),
sub:()=>R(300,40,40,60,Gy)+R(270,96,100,190,B,40)+R(256,276,128,64,D,18)+R(280,330,80,16,Kk,4)+'<path d="M70 340q40-26 80 0t80 0t80 0t80 0t80 0t80 0v60H70z" fill="#4aa3e8" opacity=".55"/>',
pkg:()=>skid+R(100,276,126,96,B,12)+fins(114,286,76,6,18)+R(230,294,100,78,D,14)+Ci(280,333,24,Lt)+R(330,300,80,14,Gy)+R(410,150,120,222,Sv,40)+R(410,240,120,10,Kk)+R(464,100,14,54,Gy)+Ci(471,92,18,"#fff")+Ci(471,92,9,D),
lrvp:()=>skid+MOT+R(304,258,236,114,B,30)+R(296,250,26,130,D,8)+R(520,250,26,130,D,8)+R(350,196,20,66,Gy)+R(450,196,20,66,Gy)+R(336,186,148,14,Sv,3)+Ci(430,318,22,Lt),
comp:()=>skid+R(80,276,130,96,B,12)+fins(94,286,76,6,19)+R(210,306,26,32,Yl)+R(236,266,190,106,D,28)+R(430,150,110,222,Sv,36)+R(430,250,110,10,Kk)+R(300,206,20,62,Gy)+R(290,196,60,14,Sv,3)};

function art(p,i,h){const col=`hsl(${h},60%,42%)`,pm=PUMP[p]||PUMP.cp;
 const bg=`<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="hsl(${h},70%,95%)"/><stop offset="1" stop-color="hsl(${h},65%,80%)"/></linearGradient></defs><rect width="640" height="440" fill="url(#g)"/>`+Ci(540,70,130,`hsla(${h},80%,100%,.4)`)+Ci(80,400,110,`hsla(${h},80%,100%,.3)`);
 const sc=i?`<g transform="translate(36,36) scale(1.5)" opacity=".9">${(IC[i]||"").replaceAll("§",col)}</g><g transform="translate(250,150) scale(.62)">${pm()}</g>`:`<g transform="translate(0,-10)">${pm()}</g>`;
 return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440">${bg}${sc}</svg>`}
async function upSvg(s){const d="data:image/svg+xml;base64,"+btoa(unescape(encodeURIComponent(s))),r=await fetch("/api/img",{method:"POST",headers:H(),body:d}),j=await r.json();if(!r.ok)throw new Error(j.error);return j.url}

async function seedTab(){view("seed","seed");$("#v_seed").innerHTML=`<div class="box"><h3>Nhập dữ liệu mẫu</h3><div class="note">Thêm sẵn: trang Giới thiệu, mô tả 3 nhóm sản phẩm, 26 sản phẩm, 30 bài Ứng dụng, 20 bài Tin tức, kèm hình minh họa tự vẽ. Mục trùng tiêu đề sẽ được bỏ qua; các bài mẫu cũ sẽ bị xóa. Mất vài phút, đừng đóng trang. Cần có file <b>seed.json</b> trong kho GitHub.</div><label><input type="checkbox" id="sd_tr" checked style="width:auto"> Tự dịch sang English (nên bật Workers AI)</label><p><button id="sd_go" onclick="runSeed()">▶ Bắt đầu nhập</button></p><pre id="sd_log" style="background:#111;color:#9f9;padding:12px;max-height:340px;overflow:auto;font-size:12px;white-space:pre-wrap"></pre></div>`}
async function runSeed(){const L=$("#sd_log"),log=m=>{L.textContent+=m+"\n";L.scrollTop=1e9},tr=$("#sd_tr").checked;$("#sd_go").disabled=true;
 try{const D=await fetch("/seed.json?v="+Date.now()).then(r=>{if(!r.ok)throw new Error("Không thấy seed.json trong kho GitHub");return r.json()});
  const ex=await api("/api/items"),by={};ex.forEach(x=>by[x.type+"|"+x.title]=x);
  for(const sl of D.purge||[]){const x=ex.find(e=>e.slug==sl);if(x){await api("/api/items/"+x.id,{method:"DELETE"});log("Đã xóa bài mẫu: "+sl)}}
  let n=0;const F=o=>[["title",0],["excerpt",0],...(["product","pgroup"].includes(o.type)?[]:[["cat",0]]),["body",1]];
  for(const it of D.items){n++;const tag=`[${n}/${D.items.length}] `;
   try{const e=it.slug?ex.find(x=>x.slug==it.slug):(by[it.type+"|"+(it.old||it.title)]||by[it.type+"|"+it.title]);let o;
    if(e){o=await api("/api/items/"+e.slug);
     if(it.slug){if((o.body||"").length>=80&&!it.force){log(tag+"giữ nguyên (đã có nội dung): "+(o.title||it.slug));continue}
      o.body=it.body;o.body_en="";if(it.title){o.title=it.title;o.title_en=it.title_en||""}if(!o.cover&&it.p)o.cover=await upSvg(art(it.p,it.i,it.h))}
     else if(it.up&&(it.old?!(o.body||"").includes("<!--v3-->"):(o.body||"").length<it.body.length*.6)){o.body=it.body;o.body_en="";if(it.old){o.title=it.title;o.title_en=""}if(it.excerpt){o.excerpt=it.excerpt;o.excerpt_en=""}log(tag+"nâng cấp bài: "+it.title)}
     else if(!(tr&&(emp(o.title_en)||(!emp(o.body)&&emp(o.body_en))))){log(tag+"bỏ qua (đã có): "+it.title);continue}}
    else o={type:it.type,title:it.title,title_en:it.title_en||"",cat:it.cat||"",cat_en:it.cat_en||"",excerpt:it.excerpt||"",excerpt_en:"",body:it.body,body_en:"",cover:it.p?await upSvg(art(it.p,it.i,it.h)):"",created:it.d,sort:it.s||0,published:true};
    if(tr)await autoTr(o,F(o),"fill",true);
    await api("/api/items",{method:"POST",body:JSON.stringify(o)});log(tag+"OK: "+(o.title||it.slug))}catch(er){log(tag+"LỖI: "+er.message)}}
  log("=== Xong! Mở trang web để xem. ===")}catch(er){log("LỖI: "+er.message)}
 $("#sd_go").disabled=false}

let CR=[];
async function contactTab(){view("contact","contact");const s=await fetch("/api/settings").then(r=>r.json());
 CR=Array.isArray(s.contacts)?s.contacts:[{l:"Địa chỉ",l_en:"Address",v:s.address||""},{l:"Điện thoại",l_en:"Phone",v:s.phone||""},{l:"Email",l_en:"Email",v:s.email||""},{l:"Giờ làm việc",l_en:"Working hours",v:s.hours||""}];
 const f=(id,l,v,ph)=>`<label>${l}</label><input id="${id}" value="${esc(v)}" placeholder="${ph||""}">`;
 $("#v_contact").innerHTML=`<div class="box"><h3>Thông tin liên hệ</h3><div class="note">Phần 1 hiện ở đầu trang. Phần 2 hiện ở trang <b>Liên hệ</b>: thêm, bớt dòng tùy ý (địa chỉ, nhiều số điện thoại, Zalo, WeChat, Facebook…). Chỉ cần điền một ngôn ngữ, bản kia tự dịch khi lưu.</div>
 <h4>1. Hiển thị ở đầu trang</h4>${f("c_phone","Điện thoại / hotline",s.phone)}${f("c_email","Email",s.email)}<label>Giờ làm việc (Tiếng Việt | English)</label><div class="two"><input id="c_hours" value="${esc(s.hours)}"><input id="c_hours_en" value="${esc(s.hours_en)}"></div>
 <h4>2. Các dòng ở trang Liên hệ</h4><div id="crows"></div><p><button class="g" onclick="addC()">＋ Thêm dòng</button></p>
 ${f("c_map","Link bản đồ nhúng (tùy chọn)",s.map,"Google Maps → Chia sẻ → Nhúng bản đồ → chép link trong src=…")}
 <p><button id="cs" onclick="saveC()">💾 Lưu thông tin liên hệ</button></p></div>`;drawC()}
function drawC(){$("#crows").innerHTML=CR.map((r,i)=>`<div class="row" style="align-items:flex-start"><div><input data-i="${i}" data-k="l" value="${esc(r.l)}" placeholder="Nhãn (VD: Địa chỉ)"></div><div><input data-i="${i}" data-k="l_en" value="${esc(r.l_en)}" placeholder="Label (EN)"></div><div style="flex:2"><input data-i="${i}" data-k="v" value="${esc(r.v)}" placeholder="Nội dung"></div><button class="r" onclick="delC(${i})">Xóa</button></div>`).join("")}
function grabC(){document.querySelectorAll("#crows input").forEach(e=>CR[e.dataset.i][e.dataset.k]=e.value)}
function addC(){grabC();CR.push({l:"",l_en:"",v:""});drawC()}
function delC(i){grabC();CR.splice(i,1);drawC()}
async function saveC(){grabC();const o=await fetch("/api/settings").then(r=>r.json()),g=i=>$("#"+i).value;
 Object.assign(o,{phone:g("c_phone"),email:g("c_email"),hours:g("c_hours"),hours_en:g("c_hours_en"),map:g("c_map")});
 const bt=$("#cs");bt.disabled=true;bt.textContent="Đang lưu…";
 try{CR=CR.filter(r=>r.l||r.l_en||r.v);for(const r of CR)await autoTr(r,[["l",0]],"fill",true);await autoTr(o,[["hours",0]],"fill",true);o.contacts=CR;
  await api("/api/settings",{method:"POST",body:JSON.stringify(o)});alert("Đã lưu!");contactTab()}catch(e){alert("Lỗi: "+e.message)}
 bt.disabled=false;bt.textContent="💾 Lưu thông tin liên hệ"}
